<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Countdown</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        text-align: center;
        color: #5b3540;
        background: #fdebf2;
      }

      * {
        box-sizing: border-box;
      }

      .birthday-card {
        width: 300px;
        margin: 50px auto;
        padding: 20px;
        background: #fff8fb;
        border: 1px solid #f1bfd0;
        border-radius: 10px;
        box-shadow: 0 4px 12px rgba(185, 91, 121, 0.15);
      }

      .birthday-emoji {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 15px;
        font-size: 34px;
        background: #fff1ad;
        border: 3px solid #edc95e;
        border-radius: 50%;
      }

      h1 {
        margin-top: 0;
        color: #c9577a;
      }

      .intro {
        margin-bottom: 20px;
      }

      form {
        text-align: center;
      }

      label {
        display: block;
        margin-bottom: 5px;
      }

      input,
      button {
        width: 100%;
        padding: 8px;
        font-size: 16px;
        text-align: center;
      }

      input {
        margin-bottom: 10px;
      }

      button {
        cursor: pointer;
        color: white;
        background: #e989a9;
        border: 0;
        border-radius: 5px;
      }

      button:hover {
        background: #d97092;
      }

      #result {
        margin-top: 20px;
        padding: 12px;
        font-weight: bold;
        color: #b84c70;
        background: #fde4ed;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <main class="birthday-card">
      <span class="birthday-emoji" aria-label="birthday cake">🎂</span>
      <h1>Birthday Countdown</h1>
      <p class="intro">
        Enter your birthday and find out how close your next celebration is.
      </p>

      <form id="birthdayForm">
        <label for="birthday">Your birthday</label>
        <input type="date" id="birthday" required />
        <button type="submit">Check the countdown</button>
      </form>

      <p id="result" aria-live="polite">Your countdown will appear here.</p>
    </main>

    <script>
      const birthdayForm = document.getElementById("birthdayForm");
      const birthdayInput = document.getElementById("birthday");
      const result = document.getElementById("result");

      birthdayForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const chosenDate = new Date(birthdayInput.value + "T00:00:00");
        const now = new Date();
        const today = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate(),
        );
        const millisecondsInOneDay = 1000 * 60 * 60 * 24;

        if (chosenDate < today) {
          result.textContent = "Please enter a date after the current date.";
          return;
        }

        const daysUntilBirthday = Math.round(
          (chosenDate - today) / millisecondsInOneDay,
        );

        if (daysUntilBirthday === 0) {
          result.textContent = "Happy birthday! Today is your special day!";
        } else if (daysUntilBirthday === 1) {
          result.textContent = `Get excited! Your birthday is in ${daysUntilBirthday} day!`;
        } else if (daysUntilBirthday < 50) {
          result.textContent = `Get excited! Your birthday is in ${daysUntilBirthday} days!`;
        } else {
          result.textContent = `Your birthday is in ${daysUntilBirthday} days!`;
        }
      });
    </script>
  </body>
</html>
