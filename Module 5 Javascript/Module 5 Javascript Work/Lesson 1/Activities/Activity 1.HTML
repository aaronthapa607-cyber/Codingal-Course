<!doctype html>
<html>
  <head>
    <title>Module 5 - Lesson 1 - Activity 1 - My Game Profile</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: aliceblue;
        text-align: center;
        padding: 30px;
      }
      h1 {
        color: navy;
      }
      button {
        background: navy;
        color: white;
        padding: 10px 25px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
      }
      div {
        border: 1px solid navy;
        width: 280px;
        margin: 6px auto;
        padding: 8px 12px;
        text-align: left;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>My Game Profile</h1>
<button onclick="showProfile()">Show Profile</button>
    <div><strong>Name: </strong><span id="name"></span></div>
    <div><strong>Score: </strong><span id="score"></span></div>
    <div><strong>Top Score: </strong><span id="record"></span></div>
    <div><strong>Rank: </strong><span id="rank"></span></div>
    <div><strong>Greeting: </strong><span id="greeting"></span></div>
    <div><strong>Stars: </strong><span id="stars"></span></div>
    <div><strong>Bonus Level: </strong><span id="bonus"></span></div>
    <div><strong>Team Name: </strong><span id="team"></span></div>
    <script>
        function showProfile(){
            let name = "Aaron Thapa";
            document.getElementById("name").innerHTML = name;
            let myScore = 10000;
            let topScore = 10000;
            document.getElementById("score").innerHTML = `${myScore} out of ${topScore}`
            let isHighScore;
            if (myScore == topScore) {
            isHighScore = "Ace";
        }
        else {
isHighScore = "Newbie"
        }
            document.getElementById("record").innerHTML = isHighScore
            let rank;
            if (myScore >=8000) {
                rank = "🥇"
            }

            else if (myScore >= 6000) {
rank = "🥈"
            }

        else {
          rank = "🥉"
        }
        document.getElementById("rank").innerHTML = rank

        let currentHour = new Date().getHours();
        let greeting;
        if (currentHour >=6 && currentHour < 12 )
    {greeting = "Good morning!"}

    else if (currentHour <= 16)
    {greeting = "Good afternoon!"}

    else if (currentHour <= 23)
{greeting = "Good evening!"}

else if (currentHour < 3 )
{greeting = "Why are you awake at this time?!" }
document.getElementById("greeting").innerHTML = greeting

let stars = ""
let count = 0;
let emoji = "⭐️"

while (count < 10) {
    stars = stars + emoji;
   // count+
   console.log("Hi there!")
}
document.getElementById("stars").innerHTML = stars;
        }

    
    </script>
  </body>
</html>
