<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Registration Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Space Grotesk", sans-serif;
      background-color: lightblue;
      text-align: center;
      margin: 0;
      padding-top: 30px;
    }

    .form-card {
      width: 400px;
      max-width: calc(100% - 60px);
      background-color: white;
      border: 2px solid blue;
      border-radius: 10px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      color: blue;
      text-align: center;
      text-transform: capitalize;
    }

    .subtitle {
      text-align: center;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 10px;
    }

    input,
    select {
      width: 90%;
      padding: 8px;
      margin-top: 5px;
      font-family: inherit;
    }

    button {
      background-color: blue;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 15px;
      cursor: pointer;
      border-radius: 20px;
      font-family: inherit;
    }

    button:disabled {
      background-color: grey;
    }

    #feedback {
      margin-top: 15px;
      padding: 10px;
    }

    #feedback.success {
      background-color: lightgreen;
      border: 1px solid green;
    }

    #feedback.error {
      background-color: pink;
      border: 1px solid red;
    }

    #feedback.pending {
      background-color: lightyellow;
      border: 1px solid orange;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <h1>Event Registration Form</h1>
    <p class="subtitle">Fill in your details to join a school event.</p>

    <form id="eventForm">
      <label for="studentName">Your Name</label>
      <input
        type="text"
        id="studentName"
        name="studentName"
        placeholder="e.g. Aaron Thapa"
        minlength="3"
        maxlength="60"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="e.g. aaron@gmail.com"
        required
      >

      <label for="age">Age</label>
      <input type="number" id="age" name="age" placeholder="e.g. 14" min="12" max="16" step="1" required>

      <label for="eventName">Choose an Event</label>
      <select id="eventName" name="eventName" required>
        <option value="">Select an event</option>
        <option value="Science Fair">Science Fair</option>
        <option value="Coding Workshop">Coding Workshop</option>
        <option value="Art Competition">Art Competition</option>
        <option value="Sports Day">Sports Day</option>
      </select>

      <button id="registerButton" type="submit">Register</button>
    </form>

    <div id="feedback" aria-live="polite" role="status">Waiting for registration...</div>
  </div>

  <script>
    const form = document.getElementById("eventForm");
    const feedback = document.getElementById("feedback");
    const registerButton = document.getElementById("registerButton");

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      feedback.className = "";

      if (!form.checkValidity()) {
        form.reportValidity();
        feedback.className = "error";
        feedback.textContent = "Please fill in all the boxes correctly.";
        return;
      }

      const studentName = document.getElementById("studentName").value.trim();
      const email = document.getElementById("email").value.trim();
      const age = Number(document.getElementById("age").value);
      const eventName = document.getElementById("eventName").value;

      if (studentName.length < 3) {
        feedback.className = "error";
        feedback.textContent = "Your name must have at least 3 letters.";
        document.getElementById("studentName").focus();
        return;
      }

      if (!Number.isInteger(age) || age < 8 || age > 18) {
        feedback.className = "error";
        feedback.textContent = "Your age must be a whole number between 8 and 18.";
        document.getElementById("age").focus();
        return;
      }

      registerButton.disabled = true;
      registerButton.textContent = "Please wait...";
      feedback.className = "pending";
      feedback.textContent = "Checking your details...";

      window.setTimeout(function() {
        const passNumber = Math.floor(Math.random() * 9000) + 1000;
        const message = document.createElement("p");
        message.textContent =
          "Registration successful! Hello " + studentName +
          ". Event: " + eventName +
          ". Email: " + email +
          ". Your pass number is EVT-" + passNumber + ".";
        feedback.replaceChildren(message);
        feedback.className = "success";
        registerButton.disabled = false;
        registerButton.textContent = "Register";
      }, 1200);
    });
  </script>
</body>
</html>
