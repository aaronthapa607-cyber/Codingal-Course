<!DOCTYPE html>
<html>
<head>
  <title>My Delivery Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: aliceblue;
      text-align: center;
      padding: 30px;
    }
    h1 { color: #ff5a43; }
    button {
      background: #ff5a43;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 5px;
    }
    div {
      border: 1px solid #ff5a43;
      width: 280px;
      margin: 8px auto;
      padding: 20px 12px;
      text-align: left;
      border-radius: 6px;
      width: 350px
    }
  </style>
</head>
<body>

  <h1>My Delivery Tracker</h1>
  <button onclick="saveOrder()">Save Order</button>
  <button onclick="startDelivery()">Start Delivery</button>

  <div>JSON Text: <span id="json-text"></span></div>
  <div>Loaded Item: <span id="loaded-item"></span></div>
  <div>Loaded Price: <span id="loaded-price"></span></div>
  <div>Status: <span id="status"></span></div>
  <div>Result: <span id="result"></span></div>

  <script>
let order = {
    item: "Pizza",
    price: 10000,
    shop: "Dominos"
}

function saveOrder() {
 let jsonText = JSON.stringify(order); // Converting to a string 
 let loadedOrder = JSON.parse(jsonText); // Converting it back into an object

 document.getElementById("json-text").innerHTML = jsonText
 document.getElementById("loaded-item").innerHTML = loadedOrder.item
 document.getElementById("loaded-price").innerHTML = loadedOrder.price


}
// This function simulates a wait for `ms` milliseconds

function delay(ms) {
    // Promise is to guarantee the completion of a task some time in the future
    return new Promise(function(resolve) {
        //This function ensures that the code waits ms milliseconds before calling the resolve()
        setTimeout(resolve, ms)
    })

}
async function startDelivery() {
    document.getElementById("result").innerHTML = ""
    document.getElementById("status").innerHTML = "Order Received!"

   
    // ADD DELAY OF 2sec HERE
    // THIS FUNCTION SHOULD WAIT HERE FOR 2 SECONDS BEFORE PROCEEDING
     await delay(2000)
document.getElementById("status").innerHTML = "Kitchen is preparing the order!"
// ADD DELAY of 4sec HERE
await delay(4000)
    document.getElementById("status").innerHTML = "Out for delivery!"
    // ADD DELAY OF 5sec HERE
  await delay(5000)
    document.getElementById("result").innerHTML = "Your pizza has arrived! Bon appetit!"
    
}
  </script>
</body>
</html>
