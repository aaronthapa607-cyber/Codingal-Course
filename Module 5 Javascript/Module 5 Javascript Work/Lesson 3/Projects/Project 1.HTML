<!DOCTYPE html>
<html>
  <head>
    <title>My Daily Task Organiser</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background: rgb(24, 24, 159);
      }
      h1,
      h3 {
        color: white;
      }
      .box {
        background: white;
        color: rgb(23, 88, 35);
      }

      
      
    </style>
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-1">My Daily Task Organiser</h1>
      <p class="mb-4 text-white">
        Sort and label your music playlist using JavaScript array methods!
      </p>

      <!-- TOPIC 1 & 2: sort() and reverse() -->
      <div class="card mb-4">
        <div class="card-body">
          <h3 class="card-title">Daily Tasks</h3>
          <button class="btn btn-primary mr-2" onclick="sortAZ()">
            Sort A to Z
          </button>
          <button class="btn btn-primary" onclick="sortZA()">
            Sort Z to A
          </button>
          <div id="nameResult" class="box p-3 mt-3 rounded"></div>
        </div>
      </div>

      <!-- TOPIC 3: sort() with compare function -->
      <div class="card mb-4">
        <div class="card-body">
          <h3 class="card-title">Time Needed (Hours) </h3>
          <button class="btn btn-primary mr-2" onclick="sortByLeastTime()">
            Least Time Needed First
          </button>
          <button class="btn btn-primary" onclick="sortByMostTime()">
            Most Time Needed First
          </button>
          <div id="countResult" class="box p-3 mt-3 rounded"></div>
        </div>
      </div>

      <!-- TOPIC 4: map() -->
      <div class="card mb-4">
        <div class="card-body">
          <h3 class="card-title">Label Every Task</h3>
          <button id="toggleTimeButton" class="btn btn-primary" onclick="switchTimeFormat()">Convert Times to Minutes</button>
          <div id="labelResult" class="box p-3 mt-3 rounded"></div>
        </div>
      </div>
    </div>
    <script>
      let tasks = [
        "Homework",

        "Exercise",

        "Chores",

        "School",
      ];
      let hours = [3, 1 , 2 , 7];

      document.getElementById("nameResult").innerHTML = tasks.join("<hr>");
      document.getElementById("countResult").innerHTML = hours.join("<hr>");
      renderTaskTimes("hours");

      function sortAZ() {
        tasks.sort();
        document.getElementById("nameResult").innerHTML = tasks.join("<hr>");
      }

      function sortZA() {
        tasks.sort();
        tasks.reverse();
        document.getElementById("nameResult").innerHTML = tasks.join("<hr>");
      }

      function sortByLeastTime() {
        hours.sort(function (a, b) {
          return a - b;
        });
        document.getElementById("countResult").innerHTML = hours.join("<hr>");
      }

      function sortByMostTime() {
        hours.sort(function (a, b) {
          return b - a;
        });

        document.getElementById("countResult").innerHTML = hours.join("<hr>");
      }

      function renderTaskTimes(unit) {
        if (unit === "minutes") {
          document.getElementById("labelResult").innerHTML = `
            <ol>
              <li>I did homework for 180 minutes.</li>
              <li>I did exercise for 60 minutes.</li>
              <li>I did chores for 120 minutes.</li>
              <li>I did school for 420 minutes.</li>
            </ol>
          `;
        } else {
          document.getElementById("labelResult").innerHTML = `
            <ol>
              <li>I did homework for 3 hours.</li>
              <li>I did exercise for 1 hours.</li>
              <li>I did chores for 2 hours.</li>
              <li>I did school for 7 hours.</li>
            </ol>
          `;
        }
      }

      function switchTimeFormat() {
        const button = document.getElementById("toggleTimeButton");

        if (button.textContent === "Convert Times to Minutes") {
          renderTaskTimes("minutes");
          button.textContent = "Convert Times to Hours";
        } else {
          renderTaskTimes("hours");
          button.textContent = "Convert Times to Minutes";
        }
      }

      
    </script>
  </body>
</html>
