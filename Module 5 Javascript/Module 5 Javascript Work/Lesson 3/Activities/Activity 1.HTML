<!DOCTYPE html>
<html>
  <head>
    <title>My Playlist Sorter</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background: lavender;
      }
      h1,
      h3 {
        color: darkviolet;
      }
      .box {
        background: white;
        color: darkviolet;
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-1">My Playlist Sorter</h1>
      <p class="text-muted mb-4">
        Sort and label your music playlist using JavaScript array methods!
      </p>

      <!-- TOPIC 1 & 2: sort() and reverse() -->
      <div class="card mb-4">
        <div class="card-body">
          <h3 class="card-title">Song Names</h3>
          <button class="btn btn-primary mr-2" onclick="sortAZ()">
            Sort A to Z
          </button>
          <button class="btn btn-primary" onclick="sortZA()">
            Sort Z to A
          </button>
          <div id="nameResult" class="box p-3 mt-3 rounded"></div>
        </div>
      </div>

      <!-- TOPIC 3: sort() with compare function -->
      <div class="card mb-4">
        <div class="card-body">
          <h3 class="card-title">Play Counts</h3>
          <button class="btn btn-primary mr-2" onclick="sortByLeastPlayed()">
            Least Played First
          </button>
          <button class="btn btn-primary" onclick="sortByMostPlayed()">
            Most Played First
          </button>
          <div id="countResult" class="box p-3 mt-3 rounded"></div>
        </div>
      </div>

      <!-- TOPIC 4: map() -->
      <div class="card mb-4">
        <div class="card-body">
          <h3 class="card-title">Label Every Play Count</h3>
          <button class="btn btn-primary" onclick="transformArray()">Add Plays Label</button>
          <div id="labelResult" class="box p-3 mt-3 rounded"></div>
        </div>
      </div>
    </div>
    <script>
      let songs = [
        "Twinkle Twinkle Little Star",

        "Merry Christmas",

        "Beethoven's 9th Symphony",
        "Happy Birthday",
      ];
      let plays = [1000, 389, 50, 10000];

      document.getElementById("nameResult").innerHTML = songs.join("<hr>");
      document.getElementById("countResult").innerHTML = plays.join("<hr>");

      function sortAZ() {
        songs.sort();
        document.getElementById("nameResult").innerHTML = songs.join("<hr>");
      }

      function sortZA() {
        songs.sort();
        songs.reverse();
        document.getElementById("nameResult").innerHTML = songs.join("<hr>");
      }

      function sortByLeastPlayed() {
        plays.sort(function (a, b) {
          return a - b;
        });
        document.getElementById("countResult").innerHTML = plays.join("<hr>");
      }

      function sortByMostPlayed() {
        plays.sort(function (a, b) {
          return b - a;
        });

        document.getElementById("countResult").innerHTML = plays.join("<hr>");
      }

      function transformArray() {
        let newArray = plays.map(function (p) {
          return `<li> I listened to this ${p} times. </li>`;
        });
        document.getElementById("labelResult").innerHTML = "<ol>" + newArray.join("<hr>") + "</ol>";
      }

      
    </script>
  </body>
</html>
