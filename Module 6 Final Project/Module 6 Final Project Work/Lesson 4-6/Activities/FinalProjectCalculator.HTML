<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: black;
        }

        #container {
            width: 1000px;
            min-height: 550px;
            max-width: 100%;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
                linear-gradient(135deg, #294c60, #5b4968, #263e4b);
        }

        .calculator {
            width: 320px;
            min-height: 520px;
            max-width: 100%;
            padding: 10px;
            background-color: #20252b;
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
        }

        .display {
            min-height: 100px;
            padding: 10px;
            text-align: right;
            color: white;
            background-color: #15191d;
            border-radius: 16px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .buttons button {
            width: 100%;
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            background-color: #343b43;
            color: white;
            font: inherit;
            font-size: 1.25rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #171b20;
            transition: transform 120ms ease, filter 120ms ease;
        }

        .buttons button:hover {
            filter: brightness(1.2);
        }

        .buttons button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #171b20;
        }

        .buttons .special {
            background-color: #59636e;
        }

        .buttons .operator {
            background-color: #e58b32;
        }

        .buttons .equal {
            background-color: #3b9b87;
        }

        @media (max-width: 600px) {
            #container {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="container">
      <div class="calculator">
        <div class="display" aria-label="Calculator display"></div>

        <div class="buttons">
            <button class="special">C</button>
            <button class="special">CE</button>
            <button class="special">%</button>
            <button class="operator">&#247</button>

            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">&#215</button>

            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">-</button>

            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator">+</button>

            <button class="number">0</button>
            <button class="number">.</button>
            <button class="equal">=</button>
        </div>
      </div>
    </div>
</body>
</html>
