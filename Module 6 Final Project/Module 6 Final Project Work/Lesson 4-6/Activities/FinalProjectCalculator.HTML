<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: black;
        }

        #container {
            width: 1000px;
            min-height: 550px;
            max-width: 100%;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
                linear-gradient(135deg, #294c60, #5b4968, #263e4b);
        }

        .calculator {
            width: 320px;
            min-height: 520px;
            max-width: 100%;
            padding: 10px;
            background-color: #2d2929;
            border-radius: 5px;
            box-shadow: 4px 8px 0 rgba(0, 0, 0, 0.2), 6px 20px 0 rgba(0, 0, 0, 0.19);
            position: relative;
            border-radius: 6px;

        }

        .display {
            min-height: 100px;
            padding: 10px;
            text-align: right;
            

        }
.output {
    text-align: right;
    height: 60px;
    margin: 10px 20px;
    font-size: 30px;
    padding: 30px;
    background-color: #555050;
}

.operator, .number, .empty{
    width: 50px;
    height:50px;
    margin: auto;
    float: left;
    border-radius: 50%;
    border-width: 0;
    font-weight: bold;
    font-size: 15px;

}

.number, .empty{
    background-color: #eaedef;
}
    .number, .empty, .special, .equal, .operator{
cursor: pointer
    }

    .special{
        background-color: #cecaca;
    }

    .operator {
        background-color: orange;
    }


    



        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
           
        }

        .buttons button {
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            #container {
                width: 100%;
            }
        }
        
      
    </style>
</head>
<body>
    <div id="container">
      <div class="calculator">
        <div class="display" aria-label="Calculator display"></div>
        <div class="result">
        <div class="history">
        <p class="history-value"></p>
        </div>
        <div class="output">
            <p class="output-value"></p>
        </div>
        </div>
        

        <div class="buttons">
            <button class="special">C</button>
            <button class="special">CE</button>
            <button class="special">%</button>
            <button class="operator">&#247</button>

            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">&#215</button>

            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">-</button>

            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator">+</button>

            <button class="number">0</button>
            <button class="number">.</button>
            <button class="equal">=</button>
        </div>
      </div>
    </div>
</body>
</html>
