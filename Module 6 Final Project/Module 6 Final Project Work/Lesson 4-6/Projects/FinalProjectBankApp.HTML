<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b35">
  <title>Aaron's Bank App</title>
  <style>
    .eyebrow {
      display: table;
      margin: 0 0 16px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #e8f4ef;
      color: #26755f;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    #app-title {
      text-transform: uppercase;
      display: block;
      margin: 0 0 24px;
      padding: 45px;
      border-radius: 16px;
      background: linear-gradient(135deg, #102b35, #31816f);
      box-shadow: 0 10px 22px rgb(16 43 53 / 20%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 2.6rem ;
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
    }
    #app {
      box-sizing: border-box;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 30px;
      border: 1px solid #dce8e4;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 20px 50px rgb(23 52 58 / 12%);
    }

    body {
      margin: 0;
      padding: 24px 12px;
      background:
        radial-gradient(ellipse at 12% 8%, #dcefe9 0, transparent 38%),
        #f1f6f4;
      color: #17343a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #balance-box {
      padding: 24px;
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 18px;
      background: linear-gradient(145deg, #173b43, #102b35);
      color: #fff;
    }

    #balance-label,
    .balance-caption {
      margin: 0;
      color: #c4d9d4;
      font-size: 0.88rem;
    }

    #balance-label {
      font-weight: 600;
    }

    #balance {
      margin: 12px 0;
      font-size: 2.6rem;
      font-weight: 750;
      letter-spacing: -0.055em;
      line-height: 1.1;
    }

    .balance-caption {
      font-size: 0.8rem;
    }

    #entry-box {
      margin-top: 26px;
    }

    #amount-label {
      display: block;
      margin-bottom: 9px;
      color: #29484d;
      font-size: 0.9rem;
      font-weight: 650;
    }

    .amount-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border: 1px solid #cbd9d5;
      border-radius: 12px;
      background: #fbfdfc;
    }

    .currency-symbol {
      color: #64807a;
      font-size: 1rem;
      font-weight: 650;
    }

    #amount {
      flex: 1;
      width: 0;
      padding: 14px 0;
      border: 0;
      background: transparent;
      color: #17343a;
      font: inherit;
      font-size: 1rem;
    }

    #amount::placeholder {
      color: #9aaba7;
    }

    main > br {
      display: none;
    }

    #button-box {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .action {
      flex: 1;
      min-height: 48px;
      padding: 12px 16px;
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      transition: transform 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
    }

    .action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgb(23 52 58 / 12%);
    }

    .action:active {
      transform: translateY(0);
    }

    .action:focus-visible {
      outline: 3px solid #17343a;
      outline-offset: 3px;
    }

    .credit {
      background: #31816f;
      color: #fff;
    }

    .credit:hover {
      background: #276c5d;
    }

    .debit {
      border-color: #e4d8d8;
      background: #fff;
      color: #7a4545;
    }

    .debit:hover {
      background: #fff7f6;
    }

    #message {
      display: flex;
      align-items: center;
      min-height: 44px;
      margin: 20px 0 0;
      padding: 12px 14px;
      border-left: 3px solid #9dbeb4;
      border-radius: 4px 10px 10px 4px;
      background: #f3f8f6;
      color: #52706b;
      font-size: 0.87rem;
      line-height: 1.5;
    }

    #note {
      margin: 18px 0;
      color: #8a9b97;
      font-size: 0.74rem;
      text-align: center;
    }

    @media (max-width: 420px) {
      #app {
        padding: 22px;
      }

      #balance-box {
        padding: 20px;
      }

      #balance {
        font-size: 2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <main id="app">

    <p class="eyebrow">YOUR MONEY, IN GOOD COMPANY</p>
    <h1 id="app-title">Aaron's bank</h1>

    <section id="balance-box" aria-labelledby="balance-label">
      <p id="balance-label">Available balance</p>
      <p id="balance">$1,000.00</p>
      <p class="balance-caption">A little progress adds up.</p>
    </section>

    <div id="entry-box">
      <label id="amount-label" for="amount">Enter amount</label>
      <div class="amount-input-wrap">
        <span class="currency-symbol" aria-hidden="true">$</span>
        <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" inputmode="decimal">
      </div>
    </div>

    <br>

    <div id="button-box">
      <button class="action credit" id="credit-btn" type="button">＋&nbsp; Credit</button>
      <button class="action debit" id="debit-btn" type="button">−&nbsp; Debit</button>
    </div>

    <p id="message" aria-live="polite">Your account is ready when you are.</p>
    <p id="note">Terms and conditions apply.</p>

  </main>

</body>
</html>
