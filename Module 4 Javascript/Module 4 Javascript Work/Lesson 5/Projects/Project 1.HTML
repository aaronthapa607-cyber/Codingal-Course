        { name: "DarkSlateBlue", value: "#483D8B" },
        { name: "MidnightBlue", value: "#191970" },
      ];

      function pickRandomColors(palette, count) {
        const shuffled = [...palette].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, count);
      }

      // 1. Function that accepts the profile object as an argument
      function displayProfile(userProfile) {
        const container = document.getElementById("profile-container");

        // Building the HTML layout using object properties and the array
        let htmlContent = `
                <div class="card">
                    <h2>${userProfile.name}'s Profile</h2>
                    <p><strong>Age:</strong> ${userProfile.age}</p>
                    <p><strong>Favorite Colors:</strong></p>
                    <ul>
            `;

        // Looping through the array elements
        userProfile.favColors.forEach(function (color) {
          htmlContent += `<li><span class="color-dot" style="background: ${color.value};"></span>${color.name}</li>`;
        });

        htmlContent += `
                    </ul>
                </div>
            `;

        // Injecting the final HTML structure into the page
        container.innerHTML = htmlContent;
      }

      const tinuObject = {
        name: "Tinu",
        age: 12,
        favColors: pickRandomColors(colorPalette, 3),
      };

      displayProfile(tinuObject);
    </script>
