  <!DOCTYPE html>
<html>

<body>

<h1>The Simple Calculator</h1>
<p><b>Let's imagine two numbers, 60 and 56.</b> </p>
<p id="add"></p>
<p id="sub"></p>
<p id="mul"></p>
<p id="div"></p>
<script>

    var num1 = 60;
    var num2 = 56;


var add = num1 + num2;
var sub = num1 - num2;
var mul = num1 * num2;
var div = num1 / num2;

document.getElementById("add").innerHTML =
"The sum of these two numbers is: " + add;
document.getElementById("sub").innerHTML =
"The difference between these two numbers is: " + sub;
document.getElementById("mul").innerHTML =
"The product of these two number is: " + mul;
document.getElementById("div").innerHTML =
"The quotient of these two numbers is: " + div;
</script>
  </body>
</html>
