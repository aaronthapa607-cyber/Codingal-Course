<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Favourite Person Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #F0F0F2; }
    h1   { color: #FF5A43; }
    .card-label { font-size: 11px; color: #999; text-transform: uppercase; }
    pre  { font-size: 13px; color: #333; }
  </style>
</head>
<body class="py-4">

  <div class="container">
    <h1 class="mb-1">You have clicked on: E's profile!</h1>
    <p class="text-muted mb-4">Introduction to Objects in JavaScript</p>

    <!-- Profile Card -->
    <div class="card shadow-sm mb-3" style="max-width:400px;">
      <div class="card-body">
        <h5 class="card-title" style="color:#FF5A43;">Profile Details</h5>
        <ul class="list-group list-group-flush">
          <li class="list-group-item"><span class="card-label d-block">Name</span><strong id="name">-</strong></li>
          <li class="list-group-item"><span class="card-label d-block">Age</span><strong id="age">-</strong></li>
          <li class="list-group-item"><span class="card-label d-block">Favourite Activity</span><strong id="favouriteactivity">-</strong></li>
          <li class="list-group-item"><span class="card-label d-block">City</span><strong id="city">-</strong></li>
        </ul>
      </div>
    </div>

    <!-- Code Box -->
    <div class="card shadow-sm" style="max-width:400px;">
      <div class="card-body">
        <h6 style="color:#FF5A43;">JavaScript Object Used</h6>
        <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
      </div>
    </div>
  </div>

  
    
    <script>
         let eProfile = {
        name: "E",
        age: "50",
        favouriteactivity: "Gaming",
        city: "Elandis",
        
      };

      document.getElementById("name").innerHTML = eProfile.name;
      document.getElementById("age").innerHTML = eProfile.age;
      document.getElementById("favouriteactivity").innerHTML = eProfile.favouriteactivity;
      document.getElementById("city").innerHTML = eProfile.city;
      document.getElementById("codeDisplay").textContent = JSON.stringify(eProfile);

    
  </script>
</body>
</html>
